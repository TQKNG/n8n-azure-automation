name: Bug report
description: Report a reproducible problem in deployment, infrastructure, workflows, or runtime
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough details for someone else to reproduce and fix it quickly.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the primary area impacted
      options:
        - GitHub Actions workflow
        - Azure OIDC and permissions
        - Bicep infrastructure
        - Cloud-init provisioning
        - Docker or Caddy runtime
        - n8n behavior
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
      placeholder: A clear and concise description of the issue
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps so the issue can be reproduced
      placeholder: |
        1. Run workflow 03-deploy with these inputs...
        2. Observe output in job deploy...
        3. See failure at step...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: run_url
    attributes:
      label: Workflow run URL
      description: If applicable, paste the failing GitHub Actions run link
      placeholder: https://github.com/owner/repo/actions/runs/1234567890

  - type: input
    id: commit_sha
    attributes:
      label: Commit SHA
      description: Commit where issue was observed
      placeholder: abc1234

  - type: input
    id: environment
    attributes:
      label: Environment
      description: production, staging, or development
      placeholder: production

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste only relevant logs and remove secrets
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I removed secrets, tokens, keys, and sensitive data from logs
          required: true
        - label: I can reproduce this issue using the steps above
          required: true
