name: 01 - Bootstrap Azure OIDC

on:
  workflow_dispatch:
    inputs:
      github_repository:
        description: 'GitHub repository (owner/repo) - leave empty to use current repo'
        required: false
        type: string
      github_environment:
        description: 'GitHub environment name'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      force_recreate:
        description: 'Force recreate OIDC configuration (deletes and recreates)'
        required: false
        default: false
        type: boolean
      azure_credentials:
        description: 'Azure Service Principal JSON (clientId, clientSecret, tenantId, subscriptionId)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap-oidc:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set repository variable
        id: set_repo
        run: |
          # Use input if provided, otherwise use current repository
          if [ -n "${{ inputs.github_repository }}" ]; then
            REPO="${{ inputs.github_repository }}"
          else
            REPO="${{ github.repository }}"
          fi
          
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "Using repository: $REPO"
      
      - name: Validate inputs
        id: validate
        run: |
          echo "🔍 Validating inputs..."
          
          REPO="${{ steps.set_repo.outputs.repo }}"
          
          # Validate format
          if [[ ! "$REPO" =~ ^[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$ ]]; then
            echo "❌ Invalid repository format: $REPO"
            echo "Expected format: owner/repo"
            exit 1
          fi
          
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "✅ Repository: $REPO"
          echo "✅ Environment: ${{ inputs.github_environment }}"
      
      - name: Check prerequisites
        run: |
          echo "🔍 Checking prerequisites..."
          
          # Check if secrets exist
          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "❌ AZURE_SUBSCRIPTION_ID secret not found"
            echo "Please run workflow 00-setup-repository.yml first"
            exit 1
          fi
          
          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            echo "❌ AZURE_TENANT_ID secret not found"
            echo "Please run workflow 00-setup-repository.yml first"
            exit 1
          fi
          
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "❌ GH_PAT secret not found"
            echo "Please run workflow 00-setup-repository.yml first"
            exit 1
          fi
          
          echo "✅ All required secrets found"
      
      - name: Parse Azure credentials
        id: parse_creds
        run: |
          echo "🔍 Parsing Azure credentials..."
          
          CREDS='${{ inputs.azure_credentials }}'
          
          # Extract values from JSON
          CLIENT_ID=$(echo "$CREDS" | jq -r '.clientId // .appId // empty')
          CLIENT_SECRET=$(echo "$CREDS" | jq -r '.clientSecret // .password // empty')
          TENANT_ID=$(echo "$CREDS" | jq -r '.tenantId // .tenant // empty')
          SUB_ID=$(echo "$CREDS" | jq -r '.subscriptionId // .subscription // empty')
          
          # Validate extracted values
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "❌ Invalid Azure credentials JSON"
            echo ""
            echo "Expected format:"
            echo '{'
            echo '  "clientId": "xxx-xxx-xxx",'
            echo '  "clientSecret": "xxx",'
            echo '  "tenantId": "xxx-xxx-xxx",'
            echo '  "subscriptionId": "xxx-xxx-xxx"'
            echo '}'
            exit 1
          fi
          
          # Use subscription from secret if not in credentials
          if [ -z "$SUB_ID" ]; then
            SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi
          
          if [ -z "$TENANT_ID" ]; then
            TENANT_ID="${{ secrets.AZURE_TENANT_ID }}"
          fi
          
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "tenant_id=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "subscription_id=$SUB_ID" >> $GITHUB_OUTPUT
          
          # Mask secret
          echo "::add-mask::$CLIENT_SECRET"
          echo "client_secret=$CLIENT_SECRET" >> $GITHUB_OUTPUT
          
          echo "✅ Credentials parsed successfully"
      
      - name: Login to Azure with provided credentials
        run: |
          echo "🔐 Logging into Azure..."
          
          az login --service-principal \
            --username "${{ steps.parse_creds.outputs.client_id }}" \
            --password "${{ steps.parse_creds.outputs.client_secret }}" \
            --tenant "${{ steps.parse_creds.outputs.tenant_id }}"
          
          az account set --subscription "${{ steps.parse_creds.outputs.subscription_id }}"
          
          echo "✅ Logged into Azure"
      
      - name: Check existing OIDC application
        id: check_existing
        continue-on-error: true
        run: |
          echo "🔍 Checking for existing OIDC application..."
          
          APP_ID=$(az ad app list \
            --display-name "github-oidc-n8n-automation" \
            --query "[0].appId" -o tsv)
          
          if [ -n "$APP_ID" ] && [ "$APP_ID" != "null" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
            echo "✅ Found existing app: $APP_ID"
            
            if [ "${{ inputs.force_recreate }}" = "true" ]; then
              echo "force_recreate=true" >> $GITHUB_OUTPUT
              echo "⚠️  Force recreate enabled - will delete and recreate"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📝 No existing app found - will create new"
          fi
      
      - name: Delete existing OIDC configuration
        if: steps.check_existing.outputs.force_recreate == 'true'
        run: |
          echo "🗑️  Deleting existing OIDC configuration..."
          
          APP_ID="${{ steps.check_existing.outputs.app_id }}"
          
          # Delete app (this also deletes service principal)
          az ad app delete --id "$APP_ID"
          
          echo "✅ Deleted existing configuration"
          echo "⏳ Waiting 10 seconds for Azure AD propagation..."
          sleep 10
      
      - name: Create Azure AD Application and Service Principal
        if: steps.check_existing.outputs.exists == 'false' || steps.check_existing.outputs.force_recreate == 'true'
        id: create_app
        run: |
          echo "🔨 Creating Azure AD application..."
          
          APP_ID=$(az ad app create \
            --display-name "github-oidc-n8n-automation" \
            --query appId -o tsv)
          
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "✅ Application created: $APP_ID"
          
          # Create service principal
          echo "🔨 Creating service principal..."
          SP_ID=$(az ad sp create --id "$APP_ID" --query id -o tsv)
          
          echo "sp_id=$SP_ID" >> $GITHUB_OUTPUT
          echo "✅ Service Principal created: $SP_ID"
          
          echo "⏳ Waiting 15 seconds for Azure AD propagation..."
          sleep 15
      
      - name: Use existing application
        if: steps.check_existing.outputs.exists == 'true' && steps.check_existing.outputs.force_recreate != 'true'
        id: use_existing
        run: |
          echo "📋 Using existing application..."
          
          APP_ID="${{ steps.check_existing.outputs.app_id }}"
          
          # Get service principal ID
          SP_ID=$(az ad sp list --filter "appId eq '$APP_ID'" --query "[0].id" -o tsv)
          
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "sp_id=$SP_ID" >> $GITHUB_OUTPUT
          echo "✅ Using existing app: $APP_ID"
          echo "✅ Using existing SP: $SP_ID"
      
      - name: Configure federated credentials
        run: |
          echo "🔨 Configuring federated credentials..."
          
          if [ -n "${{ steps.create_app.outputs.app_id }}" ]; then
            APP_ID="${{ steps.create_app.outputs.app_id }}"
          else
            APP_ID="${{ steps.use_existing.outputs.app_id }}"
          fi
          
          REPO="${{ steps.set_repo.outputs.repo }}"
          ENV="${{ inputs.github_environment }}"
          
          # Check if credential already exists
          EXISTING=$(az ad app federated-credential list \
            --id "$APP_ID" \
            --query "[?name=='github-$ENV'].name" -o tsv)
          
          if [ -n "$EXISTING" ]; then
            echo "📝 Federated credential 'github-$ENV' already exists"
            echo "⏭️  Skipping creation"
          else
            echo "🔨 Creating federated credential for $ENV..."
            
            az ad app federated-credential create \
              --id "$APP_ID" \
              --parameters "{
                \"name\": \"github-$ENV\",
                \"issuer\": \"https://token.actions.githubusercontent.com\",
                \"subject\": \"repo:$REPO:environment:$ENV\",
                \"audiences\": [\"api://AzureADTokenExchange\"],
                \"description\": \"GitHub Actions OIDC for $ENV environment\"
              }"
            
            echo "✅ Federated credential created"
          fi
      
      - name: Assign Azure roles
        run: |
          echo "🔨 Assigning Azure roles..."
          
          if [ -n "${{ steps.create_app.outputs.sp_id }}" ]; then
            SP_ID="${{ steps.create_app.outputs.sp_id }}"
          else
            SP_ID="${{ steps.use_existing.outputs.sp_id }}"
          fi
          
          SUB_ID="${{ steps.parse_creds.outputs.subscription_id }}"
          
          # Check if role assignment already exists
          EXISTING_ROLE=$(az role assignment list \
            --assignee "$SP_ID" \
            --scope "/subscriptions/$SUB_ID" \
            --query "[?roleDefinitionName=='Contributor'].id" -o tsv)
          
          if [ -n "$EXISTING_ROLE" ]; then
            echo "✅ Contributor role already assigned"
          else
            echo "🔨 Assigning Contributor role..."
            
            az role assignment create \
              --assignee "$SP_ID" \
              --role "Contributor" \
              --scope "/subscriptions/$SUB_ID"
            
            echo "✅ Contributor role assigned"
          fi
      
      - name: Update GitHub secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "🔨 Updating GitHub secret AZURE_CLIENT_ID..."
          
          if [ -n "${{ steps.create_app.outputs.app_id }}" ]; then
            APP_ID="${{ steps.create_app.outputs.app_id }}"
          else
            APP_ID="${{ steps.use_existing.outputs.app_id }}"
          fi
          
          REPO="${{ steps.set_repo.outputs.repo }}"
          
          echo "$APP_ID" | gh secret set AZURE_CLIENT_ID --repo "$REPO"
          
          echo "✅ GitHub secret updated"
      
      - name: Bootstrap summary
        run: |
          if [ -n "${{ steps.create_app.outputs.app_id }}" ]; then
            APP_ID="${{ steps.create_app.outputs.app_id }}"
            SP_ID="${{ steps.create_app.outputs.sp_id }}"
            STATUS="Created"
          else
            APP_ID="${{ steps.use_existing.outputs.app_id }}"
            SP_ID="${{ steps.use_existing.outputs.sp_id }}"
            STATUS="Updated"
          fi
          
          REPO="${{ steps.set_repo.outputs.repo }}"
          ENV="${{ inputs.github_environment }}"
          SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          TENANT_ID="${{ secrets.AZURE_TENANT_ID }}"
          
          cat >> $GITHUB_STEP_SUMMARY << EOFSUM
          ## 🎉 OIDC Bootstrap Complete!
          
          ### Configuration Details
          
          | Property | Value |
          |----------|-------|
          | **Status** | $STATUS |
          | **Application ID** | \`$APP_ID\` |
          | **Service Principal** | \`$SP_ID\` |
          | **Repository** | $REPO |
          | **Environment** | $ENV |
          | **Subscription** | \`$SUB_ID\` |
          | **Tenant** | \`$TENANT_ID\` |
          
          ### What Was Configured
          
          ✅ Azure AD Application created/updated  
          ✅ Service Principal configured  
          ✅ Federated credential for GitHub Actions  
          ✅ Contributor role assigned to subscription  
          ✅ GitHub secret \`AZURE_CLIENT_ID\` updated  
          
          ### Next Steps
          
          1. **Verify OIDC configuration**:
             \`\`\`bash
             gh workflow run 02-verify-azure-oidc.yml
             \`\`\`
          
          2. **Deploy infrastructure**:
             \`\`\`bash
             gh workflow run 03-deploy.yml
             \`\`\`
          
          ### Federated Credential Details
          
          - **Issuer**: \`https://token.actions.githubusercontent.com\`
          - **Subject**: \`repo:$REPO:environment:$ENV\`
          - **Audiences**: \`api://AzureADTokenExchange\`
          
          ---
          
          🔐 **Security Note**: The temporary service principal credentials you provided are only used for this bootstrap process and are not stored.
          EOFSUM
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 OIDC Bootstrap Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Application ID: $APP_ID"
          echo "Service Principal: $SP_ID"
          echo "Environment: $ENV"
          echo ""
          echo "✅ Ready to deploy! Run workflow: 03-deploy.yml"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"