name: 01 - Bootstrap Azure OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap-oidc:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Azure Login (with credentials)
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "placeholder",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }
        continue-on-error: true
      
      - name: Check if OIDC already configured
        id: check_oidc
        run: |
          echo "🔍 Checking for existing OIDC configuration..."
          
          if az ad app list --display-name "github-oidc-n8n-automation" --query "[0].appId" -o tsv 2>/dev/null | grep -q "."; then
            echo "app_exists=true" >> $GITHUB_OUTPUT
            echo "✅ OIDC app already exists"
          else
            echo "app_exists=false" >> $GITHUB_OUTPUT
            echo "📝 OIDC app needs to be created"
          fi
      
      - name: Create Azure AD App Registration
        if: steps.check_oidc.outputs.app_exists == 'false'
        id: create_app
        run: |
          echo "🔨 Creating Azure AD App Registration..."
          
          APP_ID=$(az ad app create \
            --display-name "github-oidc-n8n-automation" \
            --query appId -o tsv)
          
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "✅ Created App Registration: $APP_ID"
          
          # Wait for app to be created
          sleep 10
      
      - name: Get existing App ID
        if: steps.check_oidc.outputs.app_exists == 'true'
        id: get_app
        run: |
          APP_ID=$(az ad app list --display-name "github-oidc-n8n-automation" --query "[0].appId" -o tsv)
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "✅ Using existing App Registration: $APP_ID"
      
      - name: Create Service Principal
        id: create_sp
        run: |
          APP_ID=${{ steps.create_app.outputs.app_id || steps.get_app.outputs.app_id }}
          
          echo "🔨 Creating Service Principal..."
          
          SP_ID=$(az ad sp create --id $APP_ID --query id -o tsv 2>/dev/null || \
                  az ad sp list --filter "appId eq '$APP_ID'" --query "[0].id" -o tsv)
          
          echo "sp_id=$SP_ID" >> $GITHUB_OUTPUT
          echo "✅ Service Principal: $SP_ID"
          
          # Wait for SP to be created
          sleep 10
      
      - name: Configure Federated Credentials
        run: |
          APP_ID=${{ steps.create_app.outputs.app_id || steps.get_app.outputs.app_id }}
          REPO="${{ github.repository }}"
          
          echo "🔨 Configuring federated credentials..."
          
          # Create credential for production environment
          az ad app federated-credential create \
            --id $APP_ID \
            --parameters "{
              \"name\": \"github-oidc-production\",
              \"issuer\": \"https://token.actions.githubusercontent.com\",
              \"subject\": \"repo:${REPO}:environment:production\",
              \"audiences\": [\"api://AzureADTokenExchange\"],
              \"description\": \"GitHub Actions OIDC for production environment\"
            }" 2>/dev/null || echo "Credential may already exist"
          
          echo "✅ Federated credentials configured"
      
      - name: Assign RBAC Role
        run: |
          SP_ID=${{ steps.create_sp.outputs.sp_id }}
          SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          
          echo "🔨 Assigning Contributor role..."
          
          az role assignment create \
            --assignee $SP_ID \
            --role Contributor \
            --scope /subscriptions/$SUB_ID \
            2>/dev/null || echo "Role may already be assigned"
          
          echo "✅ Contributor role assigned"
      
      - name: Update AZURE_CLIENT_ID secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          APP_ID=${{ steps.create_app.outputs.app_id || steps.get_app.outputs.app_id }}
          
          echo "🔨 Updating AZURE_CLIENT_ID secret..."
          
          gh secret set AZURE_CLIENT_ID --body "$APP_ID" --repo "$REPO"
          
          echo "✅ AZURE_CLIENT_ID secret updated"
      
      - name: Generate bootstrap summary
        run: |
          APP_ID=${{ steps.create_app.outputs.app_id || steps.get_app.outputs.app_id }}
          SP_ID=${{ steps.create_sp.outputs.sp_id }}
          
          cat >> $GITHUB_STEP_SUMMARY << EOFSUM
          ## 🔐 OIDC Configuration Complete
          
          ### ✅ Resources Created
          - **App Registration**: github-oidc-n8n-automation
          - **Application ID**: \`$APP_ID\`
          - **Service Principal ID**: \`$SP_ID\`
          
          ### ✅ Configuration
          - Federated credentials configured for production environment
          - Contributor role assigned to subscription
          - AZURE_CLIENT_ID secret updated
          
          ### 🔒 Authentication Flow
          GitHub Actions → OIDC Token → Azure AD → Access Token → Azure Resources
          
          ---
          EOFSUM