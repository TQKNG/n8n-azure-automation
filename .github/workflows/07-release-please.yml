name: 07 - Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Select auth token source
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "Using GH_PAT"
          else
            echo "Using GITHUB_TOKEN"
            echo "If PR creation fails, enable repository setting: Allow GitHub Actions to create and approve pull requests"
          fi

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
